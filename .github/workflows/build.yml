name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev \
          git zip unzip openjdk-17-jdk ccache autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libsqlite3-dev cmake libgdbm-dev \
          libnss3-dev libreadline-dev libffi-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: Accept Android SDK Licenses & Build APK
      run: |
        # Tự động chấp nhận tất cả điều khoản của Android SDK
        yes | buildozer android clean || true
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TraCuuHoSo-APK
        path: bin/*.apk
